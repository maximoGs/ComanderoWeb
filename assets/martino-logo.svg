<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C178" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9E7B35" />
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1D32" />
      <stop offset="100%" stop-color="#4A101D" />
    </linearGradient>
  </defs>
  
  <!-- Emblem Badge -->
  <g transform="translate(15, 12)">
    <!-- Hexagonal / Shield crest -->
    <rect x="0" y="0" width="96" height="96" rx="20" fill="url(#wineGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Stylized "M" in Gold -->
    <path d="M 28 68 L 28 32 L 48 54 L 68 32 L 68 68 M 41 46 L 48 54 L 55 46" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Tiny Heritage Year -->
    <text x="48" y="82" fill="#E5C178" font-family="'Cinzel', Georgia, serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="2">1901</text>
  </g>

  <!-- Typography -->
  <g transform="translate(126, 26)">
    <!-- Brand Title -->
    <text x="0" y="34" fill="#FFFFFF" font-family="'Cinzel', Georgia, serif" font-size="32" font-weight="700" letter-spacing="4">MARTINO</text>
    <!-- Subtitle WINES -->
    <text x="3" y="58" fill="url(#goldGrad)" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" letter-spacing="8">W I N E S</text>
    <!-- Location & Heritage -->
    <text x="4" y="78" fill="#A89F91" font-family="'Montserrat', sans-serif" font-size="9.5" font-weight="600" letter-spacing="3.5">LUJÁN DE CUYO · MENDOZA</text>
  </g>
</svg>
